name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        # The same version as the one the pre-commit hook is used with
        run: pipx install clang-format==23.1.3

      - name: Check C++ formatting
        run: |
          git ls-files '*.cpp' '*.h' ':!:3rdparty/*' \
            | xargs clang-format --dry-run --Werror

      - name: Check line length
        run: |
          files=$(git ls-files '*.qml' '*.js' '*.cpp' '*.h' '*.yml' 'CMakeLists.txt' \
            '*/CMakeLists.txt' ':!:3rdparty/*')
          if awk 'length > 100 { print FILENAME ":" FNR ": " length " characters"; bad = 1 }
                  END { exit bad }' $files; then
            echo "All lines fit in 100 characters"
          else
            exit 1
          fi

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    # Qt 6.11 and KDE Frameworks 6.14 need a newer release than the runner's
    container: ubuntu:rolling
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        # KF6ColorScheme needs KF6Config to build against, but its -dev package does not pull it in
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake dpkg-dev extra-cmake-modules file g++ gettext git ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-webchannel-dev qt6-webengine-dev \
            libkirigami-dev libkf6colorscheme-dev libkf6config-dev libkf6coreaddons-dev \
            libkf6i18n-dev libgl-dev libvulkan-dev

      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v7
        with:
          name: udemy-tv-deb
          path: build/*.deb

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-declarative qt6-multimedia qt6-webchannel qt6-webengine \
            kirigami kcolorscheme kconfig kcoreaddons ki18n qqc2-desktop-style hicolor-icon-theme

      - uses: actions/checkout@v7

      - name: Build package
        # makepkg refuses to run as root
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix=udemy-tv-0.1.0/ \
            -o packaging/arch/udemy-tv-0.1.0.tar.gz HEAD
          useradd --create-home builder
          chown -R builder packaging/arch
          cd packaging/arch
          su builder -c 'makepkg --noconfirm'

      - uses: actions/upload-artifact@v7
        with:
          name: udemy-tv-arch
          path: packaging/arch/*.pkg.tar.*

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: udemy-tv.flatpak
          manifest-path: packaging/flatpak/io.github.udemytv.yml
          cache-key: flatpak-builder-${{ github.sha }}
